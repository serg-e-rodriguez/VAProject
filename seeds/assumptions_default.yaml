# War Room default assumptions (PROJECT_DESIGN.md §7.4). Triangles are [low, mode, high].
# CPM modes below are fallbacks; when a data snapshot exists, the mode is replaced with the
# observed median NC CPM for that channel and low/high = mode x (1 -/+ cpm_observed_spread).
cpm:
  meta: [6.0, 10.0, 14.0]
  youtube: [8.0, 13.0, 18.0]
  search: [12.0, 20.0, 28.0]
  display: [3.0, 5.0, 7.0]
  ctv: [25.0, 35.0, 50.0]        # assumption: no CTV data in either ad library
cpm_observed_spread: 0.4

saturation_k: [0.03, 0.06, 0.12]   # effective response per impression per person (~17 imps -> 63% reach)
persuasion_p: [0.0, 0.002, 0.006]   # net votes per reached persuadable voter
turnout_t: [0.0, 0.003, 0.010]      # turnout lift per reached mobilization target
retention_rho: [0.4, 0.6, 0.8]      # weekly retention of ad effects
opp_lambda: 0.0
sigma_state: 3.5                    # statewide baseline error, pts
sigma_unit: 2.5                     # extra district error, pts
env_shift_pts: 0.0
dem_share_mobilized: 0.85

presets:
  conservative:
    cpm_multiplier: 1.25
    saturation_k: [0.02, 0.04, 0.08]
    persuasion_p: [0.0, 0.001, 0.003]
    turnout_t: [0.0, 0.0015, 0.005]
    retention_rho: [0.3, 0.5, 0.7]
    opp_lambda: 0.5
  optimistic:
    cpm_multiplier: 0.8
    saturation_k: [0.05, 0.09, 0.15]
    persuasion_p: [0.001, 0.0035, 0.008]
    turnout_t: [0.001, 0.005, 0.014]
    retention_rho: [0.5, 0.7, 0.85]
    opp_lambda: 0.0
