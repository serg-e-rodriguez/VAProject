[project]
name = "nc-campaign-war-room"
version = "0.1.0"
description = "NC political ad intelligence dashboard and War Room budget simulator (Streamlit + Altair)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "altair>=5.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.3",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.6",
]
geo = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_intel"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM117", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
