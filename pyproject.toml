[project]
name = "vaproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "serg-e-rodriguez", email = "sergrodo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "db-dtypes>=1.8.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-bigquery-storage>=2.43.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.0",
]

[project.scripts]
vaproject = "vaproject:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
